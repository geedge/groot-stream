sinks:
  print_sink:
    type: print
    properties:
      format: json
      mode: log_warn

application:
  env:
    name: example-inline-to-print
    parallelism: 1
    execution:
      checkpointing:
        interval: 10000
        mode: exactly_once
        timeout: 1200000
        data-uri: file:///tmp/grootstream/checkpoints
        max-concurrent-checkpoints: 2
        cleanup: true
        min-pause: 100
        tolerable-failed-checkpoints: 5
      restart:
          strategy: fixed-delay
          attempts: 2
          delayBetweenAttempts: 1000
    state:
      backend: rocksdb
    flink:
      pipeline:
        max-parallelism: 5
    pipeline:
      object-reuse: true
  topology:
    - name: inline_source
      downstream: [print_sink]
    - name: print_sink
      downstream: []
sources:
  kafkasource_bj:
    format: json
    type : net.geedgenetworks.source.KafkaSource
    output_fields: ['common_server_ip','common_server_port','common_recv_time','http_domain','common_sessions']
    watermark_timestamp: common_recv_time
    watermark_lag: 60
    properties:
        topics:  SESSION-RECORD-COMPLETED
        kafka.bootstrap.servers: 192.168.44.12:9092
        kafka.session.timeout.ms: 60000
        kafka.max.poll.records: 3000
        kafka.max.partition.fetch.bytes: 31457280
        kafka.security.protocol:
        kafka.ssl.keystore.location:
        kafka.ssl.keystore.password:
        kafka.ssl.truststore.location:
        kafka.ssl.truststore.password:
        kafka.ssl.key.password:
        kafka.sasl.mechanism:
        kafka.sasl.jaas.config:
        kafka.buffer.memory:
        kafka.group.id: SESSION-RECORD-COMPLETED-GROUP
        kafka.auto.offset.reset: latest
        kafka.max.request.size:
        kafka.compression.type: none
  ipfixsource1:
    type : net.geedgenetworks.source.IPFIXSource
    watermark_lag: 60
    properties:
      port: 12345
      buffer_size: 65535
  ipfixsource2:
    type: net.geedgenetworks.source.IPFIXSource
    watermark_lag: 60
    properties:
      port: 12346
      buffer_size: 65535
  ipfixsource3:
    type: net.geedgenetworks.source.IPFIXSource
    watermark_lag: 60
    properties:
      port: 12347
      buffer_size: 65535

filters:
  http_filter:
    type: net.geedgenetworks.filter.AviatorFilter
    output_fields:
    properties:
      expression: map.common_schema_type == 'HTTP' && map.common_server_port > 60


pre_processing_pipelines:
  common_pre_processor:
    type: net.geedgenetworks.processor.projection.ProjectionProcessorImpl
    output_fields:
    properties:
      key: value
    functions:
      - name: SNOWFLAKE_ID
        lookup_fields: ['']
        output_fields: ['common_log_id']
        filter:
        class_name: net.geedgenetworks.udf.snowflake.SnowflakeIdFunction
        parameters:
          snowid_zookeeper: 192.168.44.12
          data_center_id_num: 1
      - name: DROP
        lookup_fields: ['']
        output_fields: ['']
        filter: map.common_schema_type == 'HTTP' && map.common_server_port > 60
        class_name: net.geedgenetworks.udf.DropFunction
        parameters:
          snowid_zookeeper: 192.168.44.12
          data_center_id_num: 1


processing_pipelines:
  session_record_processor:
    type: net.geedgenetworks.processor.projection.ProjectionProcessorImpl
    output_fields:
    properties:
      key: value
    functions:
      - name: BASE64_DECODE_TO_STRING
        lookup_fields: ['mail_subject','mail_subject_charset']
        output_fields: ['mail_subject']
        class_name: net.geedgenetworks.udf.DecodeBase64Function
      - name: TOP_LEVEL_DOMAIN
        lookup_fields: ['http_url']
        output_fields: ['http_tld']
        class_name: net.geedgenetworks.udf.TopDomainFunction
      - name: RENAME
        lookup_fields: ['http_domain']
        output_fields: ['common_server_domain']
        class_name: net.geedgenetworks.udf.RenameFunction




  aggregate_processor2:
    type: net.geedgenetworks.processor.aggregate.AggregateProcessorImpl
    group_by_fields: ['common_server_ip']
    timestamp_field: common_recv_time
    window_type: tumbling
    window_interval_seconds: 60
    output_fields:
    properties:
      key: value
    function_list: 
        - name: sum
          input_fields: ['']
          output_fields: ['']
          filter: ''
          main_class:
          parameters:

sink:
  kafkasink_lz:
    format: json
    type : net.geedgenetworks.sink.KafkaSink
    output_fields: ['common_server_ip','common_server_port','common_recv_time','http_domain','common_sessions']
    properties:
      kafka.topic:  SESSION-RECORD-COMPLETED
      kafka.bootstrap.servers: 192.168.44.12:9092
      kafka.retries: 0
      kafka.linger.ms: 10
      kafka.request.timeout.ms: 30000
      kafka.batch.size: 262144
      kafka.buffer.memory: 134217728
      kafka.max.request.size:  10485760
      kafka.compression.type: none
      kafka.security.protocol:
      kafka.ssl.keystore.location:
      kafka.ssl.keystore.password:
      kafka.ssl.truststore.location:
      kafka.ssl.truststore.password:
      kafka.ssl.key.password:
      kafka.sasl.mechanism:
      kafka.sasl.jaas.config:

application:
  name: demo
  parallelism: 1
  topology:
    ipfixsource1:
      parallelism: 2
      next: []
    ipfixsource2:
      parallelism: 2
      next: []
    ipfixsource3:
      parallelism: 2
      next: []

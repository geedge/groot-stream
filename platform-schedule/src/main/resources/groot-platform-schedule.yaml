application:
  name: groot-test
 # parallelism: 1
  topology:
    kafkasource_bj:
      next: ['session_record_processor','cn_record_processor']
    session_record_processor:
      parallelism: 3
      next: ['kafkasink_tsg']
    cn_record_processor:
      parallelism: 1
      next: ['kafkasink_cn']
    kafkasink_tsg:
      next: []
    kafkasink_cn:
      next: []

  name: cn-test
  parallelism: 1
  topology:
    kafkasource_bj:
      parallelism: 3
      next: ['session_record_processor']
#    http_filter:
#      parallelism: 10
#      next: ['common_pre_processor']
#    common_pre_processor:
#      parallelism: 10
#      next:  []
    session_record_processor:
      parallelism: 3
      next: ['kafkasink_lz']
    kafkasink_lz:
      parallelism: 3
      next: []


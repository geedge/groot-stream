sources:
  kafka_source:
    type : kafka
    # fields: # [array of object] Field List, if not set, all fields(Map<String, Object>) will be output.
    # watermark_timestamp: common_recv_time # [string] Watermark Field Name
    # watermark_timestamp_unit: ms # [string] Watermark Unit, default is ms
    # watermark_lag: 60 # [number] Watermark Lag, default is 60
    properties: # [object] Source Properties
        topic:  SESSION-RECORD-COMPLETED
        kafka.bootstrap.servers: 192.168.44.11:9092
        kafka.session.timeout.ms: 60000
        kafka.max.poll.records: 3000
        kafka.max.partition.fetch.bytes: 31457280
        kafka.security.protocol:
        kafka.ssl.keystore.location:
        kafka.ssl.keystore.password:
        kafka.ssl.truststore.location:
        kafka.ssl.truststore.password:
        kafka.ssl.key.password:
        kafka.sasl.mechanism:
        kafka.sasl.jaas.config:
        kafka.buffer.memory:
        kafka.group.id: SESSION-RECORD-COMPLETED-GROUP-GROOT-STREAM-20231021
        kafka.auto.offset.reset: latest
        kafka.max.request.size:
        kafka.compression.type: none
        format: json # [string] Data Format, default is json

  inline_source:
    type : inline
    fields:   # [array of object] Field List, if not set, all fields(Map<String, Object>) will be output.
      - name: log_id
        type: bigint
      - name: recv_time
        type: bigint
      - name: client_ip
        type: string
    # watermark_timestamp: recv_time
    # watermark_timestamp_unit: s
    # watermark_lag: 60
    properties:
      data:  '{"log_id": 1, "recv_time":"111", "client_ip":"192.168.0.1"}'
      format: json
      json.ignore.parse.errors: false

filters:
  schema_type_filter:
    type: com.geedgenetworks.core.filter.AviatorFilter
    output_fields:
    properties:
      expression: map.common_schema_type == 'SSL' || map.common_schema_type == 'HTTP' || map.common_schema_type == 'BASE'


preprocessing_pipelines:
  preprocessing_processor: # [object] Preprocessing Pipeline
    type: com.geedgenetworks.core.processor.projection.ProjectionProcessorImpl
    output_fields:
    properties:
      key: value
    functions:
      - function: SNOWFLAKE_ID
        lookup_fields: ['']
        output_fields: ['common_log_id']
        filter:
      - function: DROP
        lookup_fields: ['']
        output_fields: ['']
        filter: map.common_schema_type == 'HTTP' && map.common_server_port > 60
        parameters:

processing_pipelines:
  session_record_processor: # [object] Processing Pipeline
    type: com.geedgenetworks.core.processor.projection.ProjectionProcessorImpl
    remove_fields:
    output_fields:
    properties:
      key: value
    functions: # [array of object] Function List
      - function: SNOWFLAKE_ID
        lookup_fields: [ '' ]
        output_fields: [ common_log_id ]
        filter:
      - function: EVAL
        output_fields: [ common_internal_ip ]
        parameters:
          value_expression: 'common_direction=69 ? common_client_ip : common_server_ip'
      - function: EVAL
        output_fields: [ common_external_ip ]
        parameters:
          value_expression: 'common_direction=73 ? common_client_ip : common_server_ip'
      - function: JSON_EXTRACT
        lookup_fields: [ common_device_tag ]
        output_fields: [ common_data_center ]
        filter:
        parameters:
          param: $.tags[?(@.tag=='data_center')][0].value
      - function: JSON_EXTRACT
        lookup_fields: [ common_device_tag ]
        output_fields: [ common_device_group ]
        filter:
        parameters:
          param: $.tags[?(@.tag=='device_group')][0].value
      - function: UNIX_TIMESTAMP_FUNCTION
        output_fields: [ common_processing_time ]
        parameters:
          precision: seconds
      - function: EVAL
        output_fields: [ common_recv_time ]
        parameters:
          value_expression: 'common_ingestion_time'
      - function: DOMAIN
        lookup_fields: [ http_host,ssl_sni,quic_sni ]
        output_fields: [ common_server_domain ]
        parameters:
          option: FIRST_SIGNIFICANT_SUBDOMAIN
      - function: EVAL
        output_fields: [ http_domain ]
        parameters:
          value_expression: 'common_server_domain'
      - function: BASE64_DECODE_TO_STRING
        lookup_fields: [ mail_subject,mail_subject_charset ]
        output_fields: [ mail_subject ]
      - function: BASE64_DECODE_TO_STRING
        lookup_fields: [ mail_attachment_name,mail_attachment_name_charset ]
        output_fields: [ mail_attachment_name ]

sinks:
  kafka_sink_a:
    type: kafka
    properties:
      topic:  SESSION-RECORD-JSON
      kafka.bootstrap.servers: 192.168.44.12:9092
      kafka.retries: 0
      kafka.linger.ms: 10
      kafka.request.timeout.ms: 30000
      kafka.batch.size: 262144
      kafka.buffer.memory: 134217728
      kafka.max.request.size:  10485760
      kafka.compression.type: snappy
      kafka.security.protocol:
      kafka.ssl.keystore.location:
      kafka.ssl.keystore.password:
      kafka.ssl.truststore.location:
      kafka.ssl.truststore.password:
      kafka.ssl.key.password:
      kafka.sasl.mechanism:
      kafka.sasl.jaas.config:
      format: json

  kafka_sink_b:
    type: kafka
    properties:
      topic: SESSION-RECORD-COMPLETED-TEST
      kafka.bootstrap.servers: 192.168.44.12:9092
      kafka.retries: 0
      kafka.linger.ms: 10
      kafka.request.timeout.ms: 30000
      kafka.batch.size: 262144
      kafka.buffer.memory: 134217728
      kafka.max.request.size: 10485760
      kafka.compression.type: snappy
      format: json

  print_sink:
    type: print
    properties:
      format: json

application: # [object] Application Configuration
  name: groot-stream-test # [string] Application Name
  env: # [object] Environment Variables
    execution.parallelism: 1 # [number] Job-Level Parallelism
  topology: # [array of object] Node List. It will be used build data flow for job dag graph.
    - name: kafka_source # [string] Node Name, must be unique. It will be used as the name of the corresponding Flink operator. eg. kafka_source the processor type as SOURCE.
      parallelism: 1 # [number] Operator-Level Parallelism.
      downstream: [schema_type_filter] # [array of string] Downstream Node Name List.
    - name: schema_type_filter
      parallelism: 1
      downstream: [session_record_processor]
    - name: session_record_processor
      parallelism: 1
      downstream: [kafka_sink_a, kafka_sink_b]
    - name: kafka_sink_a
      parallelism: 1
      downstream: []
    - name: kafka_sink_b
      parallelism: 1
      downstream: []


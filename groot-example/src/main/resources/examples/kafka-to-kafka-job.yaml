sources:
  kafka_source:
    format: json
    type : com.geedgenetworks.connectors.kafka.source.KafkaSource
    output_fields: [ip_string, fqdn_string, port_int32]
    properties:
        topics:  [GROOT-STREAM-EXAMPLE-TEST]
        kafka.bootstrap.servers: 192.168.44.12:9092
        kafka.session.timeout.ms: 60000
        kafka.group.id: GROOT-STREAM-EXAMPLE-TEST
        kafka.auto.offset.reset: latest

filters:
  filter:
    type: com.geedgenetworks.core.filter.AviatorFilter
    properties:
      expression: map.fqdn_string == 'www.geedgenetworks.com'

processing_pipelines:
  transform_processor:
    type: com.geedgenetworks.core.processor.projection.ProjectionProcessorImpl
    functions:
      - function: FIRST_SIGNIFICANT_SUBDOMAIN
        lookup_fields: ['fqdn_string']
        output_fields: ['additional_field_subdomain']
      - function: EVAL
        output_fields: ['additional_field_subdomain']
        parameters:
          value_expression: 'fqdn_string'

sinks:
  kafka_sink:
    format: json
    type : com.geedgenetworks.connectors.kafka.sink.KafkaSink
    properties:
      topic:  GROOT-STREAM-EXAMPLE-TEST-PROCESSED
      kafka.bootstrap.servers: 192.168.44.12:9092
      kafka.request.timeout.ms: 30000
      kafka.batch.size: 262144
      kafka.buffer.memory: 134217728
      kafka.max.request.size:  10485760

application:
  name: groot-stream-example
  env:
    execution.parallelism: 1
  topology:
    - input: kafka_source
      parallelism: 1
      targets:
        - filter
    - input: filter
      targets:
       - transform_processor
    - input: transform_processor
      targets:
        - kafka_sink

